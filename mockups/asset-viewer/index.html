<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>asset viewer · codebase space explorer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0d0b16; overflow: hidden; }
    body { display: grid; place-items: center; font: 12px/1.4 ui-monospace, Menlo, monospace; color: #e6e0ee; }
    #view { image-rendering: pixelated; display: block; }
    #ui { position: fixed; top: 10px; left: 10px; width: 210px; padding: 10px 12px; background: #1a1626e6; border: 1px solid #3b3866; max-height: calc(100vh - 42px); overflow-y: auto; } /* scrolls when the controls outgrow the window */
    #ui h1 { font-size: 12px; margin: 0 0 8px; color: #fff6e4; font-weight: 600; }
    #ui label { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin: 6px 0; }
    #ui input[type=range] { width: 110px; accent-color: #a993ec; }
    #ui .row { display: flex; gap: 4px; margin: 6px 0; }
    #ui button, #ui select { font: inherit; background: #3b3349; color: #e6e0ee; border: 1px solid #5d5372; padding: 2px 6px; cursor: pointer; }
    #ui .hint { color: #a99cbf; margin-top: 8px; }
  </style>
  <script type="importmap">{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  } }</script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="ui">
    <h1>asset viewer · batch 1</h1>
    <div class="row"><button data-view="planet">planet</button><button data-view="crew">crew</button><button data-view="depth">depth</button></div>
    <div class="row"><button data-view="studio">studio</button><button data-view="system">system</button><button data-view="star">star</button></div>
    <label>biome <select id="biome"></select></label>
    <label>size <span id="size-readout">1.00</span><input id="size" type="range" min="25" max="220" value="100"></label>
    <label>seed <span id="seed-readout">7</span><input id="seed" type="range" min="1" max="999" value="7"></label>
    <div class="row"><button id="reseed">new planet</button></div>
    <label>clouds <span id="cover-readout">27%</span><input id="cover" type="range" min="0" max="45" value="27"></label>
    <label>ring <select id="ring"><option value="off">off</option><option value="thin" selected>thin</option><option value="wide">wide (shared lib)</option></select></label>
    <label>&nbsp;width <span id="ring-width-readout">0.22</span><input id="ring-width" type="range" step="1"></label>
    <label>&nbsp;distance <span id="ring-inner-readout">1.69</span><input id="ring-inner" type="range" step="1"></label>
    <label>eyes <select id="eyes"><option value="auto">auto (handle)</option></select></label>
    <label>contributor <select id="color"><option value="coral">coral</option><option value="mint">mint</option><option value="lilac">lilac</option></select></label>
    <label>pixel h <input id="pixel" type="range" min="120" max="480" value="180"></label>
    <div class="hint" id="pixel-readout"></div>
    <label>depth fade <input id="depth" type="checkbox" checked></label>
    <label>depth mode <select id="depth-mode"></select></label>
    <label>depth bands <select id="depth-bands"></select></label>
    <label>lava <select id="lava-mode"></select></label>
    <label>rotate <input id="spin" type="checkbox" checked></label>
    <label>moons <input id="moons" type="checkbox" checked></label>
    <label>dark halo <input id="halo" type="checkbox"></label>
    <label>artefacts <input id="artefacts" type="checkbox"></label>
    <label>&nbsp;auto (by size) <input id="art-auto" type="checkbox" checked></label>
    <label>&nbsp;sectors <span id="art-count-readout">3</span><input id="art-count" type="range" min="1" max="5" value="3"></label>
    <label>&nbsp;teal accent <input id="art-teal" type="checkbox"></label>
    <label>debris <input id="debris" type="checkbox"></label>
    <label>&nbsp;pieces <select id="debris-count"></select></label>
    <label>&nbsp;age <select id="debris-age"></select></label>
    <div class="row"><button id="debris-sweep">sweep one</button></div>
    <label>star (system) <input id="star" type="checkbox"></label>
    <label>&nbsp;size <span id="star-size-readout">1.60</span><input id="star-size" type="range" min="50" max="300" value="160"></label>
    <label>&nbsp;corona <input id="star-corona" type="checkbox" checked></label>
    <label>&nbsp;spin (turns) <input id="star-spin" type="number" min="0" max="3" step="1" value="1" style="width:54px"></label>
    <label>&nbsp;granulation <span id="star-gran-readout">1.00</span><input id="star-gran" type="range" min="0" max="200" value="100"></label>
    <label>&nbsp;moonlets <input id="star-moonlets" type="number" min="0" max="12" step="1" value="0" style="width:54px"></label>
    <label>loop (s) <input id="period" type="number" min="1" max="60" step="0.5" value="24" style="width:54px"></label>
    <label>surface turns <input id="surface-turns" type="number" min="1" max="6" step="1" value="2" style="width:54px"></label>
    <label>cloud turns <input id="cloud-turns" type="number" min="0" max="8" step="1" value="3" style="width:54px"></label>
    <label>cloud shadow <input id="cloud-shadow" type="checkbox" checked></label>
    <label>palette <select id="palette"><option value="final">final (BLK 36 crew + v2 world)</option></select></label>
    <div class="hint">drag to orbit · scroll to zoom</div>
  </div>
  <script type="module" src="./viewer.js"></script>
</body>
</html>
