<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>asset library · commet</title>
  <!-- UI chrome only: every pixel in the stage comes from the palette modules. -->
  <style>
    :root {
      --bg: #0d0b16; --panel: #15121f; --panel2: #1c1829; --line: #2f2a44; --line2: #4a4266;
      --text: #e6e0ee; --dim: #a99cbf; --faint: #8d83a6; --head: #fff6e4; --hi: #a993ec;
      --final: #00bc9c; --explore: #e0a020; --warn: #ff965f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 12px/1.4 ui-monospace, Menlo, monospace; }
    body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
    button, select, input, textarea { font: inherit; color: var(--text); }
    button, select { background: #2a2440; border: 1px solid var(--line2); padding: 3px 8px; cursor: pointer; border-radius: 0; }
    button:hover, select:hover { border-color: var(--hi); }
    button:focus-visible, select:focus-visible, input:focus-visible, summary:focus-visible, .tile:focus-visible { outline: 2px solid var(--hi); outline-offset: 1px; }
    button.on { background: #3b3366; border-color: var(--hi); color: var(--head); }
    button:disabled, input:disabled, select:disabled { opacity: 0.45; cursor: default; }

    header { display: flex; align-items: center; gap: 14px; padding: 7px 12px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 13px; font-weight: 600; color: var(--head); white-space: nowrap; }
    header h1 span { color: var(--faint); font-weight: 400; }
    .tabs, .actions { display: flex; gap: 4px; }
    .actions { margin-left: auto; }

    main { display: grid; grid-template-columns: 364px 1fr 312px; min-height: 0; }
    aside { overflow-y: auto; min-height: 0; background: var(--panel); }
    #catalogue { border-right: 1px solid var(--line); padding: 4px 10px 20px; }
    #panel { border-left: 1px solid var(--line); padding: 0 12px 24px; }

    .group h2 { font-size: 11px; margin: 14px 0 2px; color: var(--head); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
    .group p { margin: 0 0 6px; color: var(--faint); font-size: 11px; }
    .grid { display: grid; grid-template-columns: repeat(2, 160px); gap: 8px 12px; }
    .tile { position: relative; display: block; padding: 0; width: 160px; background: none; border: 1px solid var(--line); text-align: left; cursor: pointer; }
    .tile canvas, .tile .ph { display: block; width: 160px; height: 90px; image-rendering: pixelated; background: var(--bg); }
    .tile .ph { display: grid; place-items: center; color: var(--faint); font-size: 11px; text-align: center; padding: 18px 12px 0; border-bottom: 1px dashed var(--line2); }
    .tile .cap { display: block; padding: 3px 5px 4px; background: var(--panel2); }
    .tile .cap b { display: block; font-weight: 600; color: var(--head); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile .cap i { display: block; font-style: normal; color: var(--dim); font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tile.sel { border-color: var(--hi); box-shadow: 0 0 0 1px var(--hi); }
    .tile.explore { border-style: dashed; border-color: #6b5a2a; }
    .tile.explore.sel { border-color: var(--explore); box-shadow: 0 0 0 1px var(--explore); }
    .badge { position: absolute; top: 3px; left: 3px; padding: 0 4px; font-size: 9.5px; line-height: 14px; text-transform: uppercase; letter-spacing: 0.05em; background: var(--bg); }
    .badge.final { color: var(--final); border: 1px solid #00453880; }
    .badge.explore { color: var(--explore); border: 1px solid #6b5a2a; }
    .badge.todo { color: var(--faint); border: 1px solid var(--line2); }
    .badge.tag { color: var(--hi); border: 1px solid var(--line2); }

    #stage { position: relative; display: grid; grid-template-rows: 1fr auto; min-width: 0; min-height: 0; }
    #well { display: grid; place-items: center; overflow: hidden; min-height: 0; }
    #frame { position: relative; line-height: 0; }
    #view { display: block; image-rendering: pixelated; touch-action: none; }
    #frame.scene #view { cursor: crosshair; }
    #sel { position: absolute; pointer-events: none; border: 1px dashed var(--hi); display: none; line-height: 1.2; }
    #sel span { position: absolute; left: -1px; bottom: 100%; padding: 1px 5px; background: var(--hi); color: var(--bg); white-space: nowrap; font-size: 11px; }
    #stage-badge { position: absolute; top: 10px; left: 12px; line-height: 1.3; padding: 2px 7px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; background: #0d0b16d9; }
    #stage-badge.final { color: var(--final); border: 1px solid #007c66; }
    #stage-badge.explore { color: var(--explore); border: 1px solid var(--explore); }
    /* the iteration view (history tab): one pane, or two side by side, each captioned */
    .pane { margin: 0; }
    .pane figcaption, .pane .miss { display: none; }
    #well:not(.history) .pane img.arch { display: none !important; }
    #well.history .pane { display: grid; justify-items: center; align-content: center; gap: 6px; min-width: 0; }
    #well.history .pane figcaption { display: block; line-height: 1.5; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
    #well.history .pane figcaption b { color: var(--head); font-weight: 600; }
    #well.history .pane .miss:not([hidden]) { display: grid; place-items: center; width: 640px; max-width: 90vw; aspect-ratio: 16 / 9; margin: 0; padding: 16px; color: var(--faint); text-align: center; border: 1px dashed var(--line2); }
    #well.cmp { grid-template-columns: 1fr 1fr; gap: 0 12px; padding: 0 8px; }
    #well.cmp.stack { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; gap: 12px 0; padding: 4px 8px; }
    .pane .pic { line-height: 0; }
    .pane canvas, .pane img.arch { display: block; image-rendering: pixelated; }
    [hidden] { display: none !important; }
    .hb { display: inline-block; margin-left: 4px; padding: 0 4px; font-size: 9.5px; line-height: 14px; text-transform: uppercase; letter-spacing: 0.05em; border: 1px solid var(--line2); color: var(--dim); vertical-align: 1px; }
    .hb.live { color: var(--hi); }
    .hb.final { color: var(--final); border-color: #007c66; }
    .hb.explore { color: var(--explore); border-color: #6b5a2a; }
    .hb.tag { color: var(--hi); }
    .btns.fam button { padding: 2px 6px; }
    .timeline { list-style: none; margin: 8px 0; padding: 0; }
    .timeline .step { position: relative; margin: 0 0 8px 10px; padding: 6px 7px 4px; border: 1px solid var(--line); background: var(--panel2); cursor: pointer; }
    .timeline .step::before { content: ''; position: absolute; left: -10px; top: -9px; bottom: -9px; border-left: 1px solid var(--line2); }
    .timeline .step::after { content: ''; position: absolute; left: -13px; top: 12px; width: 5px; height: 5px; background: var(--line2); }
    .timeline .step.final::after { background: var(--final); }
    .timeline .step:hover { border-color: var(--line2); }
    .timeline .step.sel { border-color: var(--hi); box-shadow: 0 0 0 1px var(--hi); cursor: default; }
    .timeline .step.cmp { border-color: var(--explore); }
    .timeline .step:focus-visible { outline: 2px solid var(--hi); outline-offset: 1px; }
    .timeline .top { display: grid; grid-template-columns: 112px 1fr; gap: 7px; align-items: start; }
    .timeline .thumb { display: grid; place-items: center; width: 112px; height: 63px; background: var(--bg); overflow: hidden; border: 1px solid #0006; }
    .timeline .thumb canvas { display: block; image-rendering: pixelated; }
    .timeline .thumb img { width: 112px; height: 63px; object-fit: contain; }
    .timeline .thumb .ph { color: var(--faint); font-size: 10px; text-align: center; padding: 4px; }
    .timeline .head { min-width: 0; }
    .timeline .head .when { display: block; color: var(--faint); font-size: 10.5px; }
    .timeline .head b { display: block; color: var(--head); font-weight: 600; margin: 1px 0 2px; }
    .timeline .head .hb { margin: 0 3px 2px 0; }
    .timeline p { margin: 5px 0 0; color: var(--text); font-size: 11px; }
    .timeline p i { font-style: normal; color: var(--faint); text-transform: uppercase; font-size: 9.5px; letter-spacing: 0.05em; }
    #status { display: flex; gap: 16px; padding: 6px 12px; color: var(--dim); border-top: 1px solid var(--line); background: var(--panel); white-space: nowrap; overflow: hidden; }
    #status b { color: var(--text); font-weight: 400; }

    #panel h3 { position: sticky; top: 0; z-index: 2; margin: 0 -12px; padding: 9px 12px 7px; font-size: 12px; color: var(--head); background: var(--panel); border-bottom: 1px solid var(--line); font-weight: 600; }
    #panel h3 small { display: block; color: var(--dim); font-weight: 400; font-size: 11px; margin-top: 1px; }
    details { border-bottom: 1px solid var(--line); padding: 2px 0 6px; }
    summary { cursor: pointer; padding: 6px 0 3px; color: var(--hi); text-transform: uppercase; letter-spacing: 0.06em; font-size: 11px; user-select: none; }
    .row { display: grid; grid-template-columns: 92px 1fr 50px; align-items: center; gap: 6px; margin: 4px 0; min-height: 22px; }
    .row > span:first-child { color: var(--dim); }
    .row .val { color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
    .row.wide { grid-template-columns: 92px 1fr; }
    .row input[type=range] { width: 100%; accent-color: var(--hi); margin: 0; }
    .row select { width: 100%; padding: 2px 4px; }
    .row input[type=text] { width: 100%; background: var(--bg); border: 1px solid var(--line2); padding: 2px 5px; }
    .row input[type=checkbox] { justify-self: start; accent-color: var(--hi); margin: 0; }
    .row input[type=color] { width: 100%; height: 22px; padding: 0 2px; background: var(--bg); border: 1px solid var(--line2); cursor: pointer; }
    .btns { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0; }
    .btns button { padding: 2px 7px; }
    .note { color: var(--faint); font-size: 11px; margin: 4px 0; }
    .note.warn { color: var(--warn); }
    .ramp { display: flex; gap: 2px; }
    .ramp i { display: block; width: 18px; height: 14px; border: 1px solid #0006; }
    .eyes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3px; margin: 4px 0; }
    .eyes button { text-align: left; padding: 2px 6px; font-size: 11px; }

    .items { margin: 6px 0; }
    .items .it { display: grid; grid-template-columns: 1fr auto auto; gap: 4px; align-items: center; padding: 3px 5px; border: 1px solid transparent; cursor: pointer; }
    .items .it:hover { border-color: var(--line2); }
    .items .it.sel { border-color: var(--hi); background: #a993ec18; }
    .items .it button { padding: 0 6px; font-size: 11px; }

    .pal-group { margin: 10px 0 14px; }
    .pal-group h4 { margin: 0 0 1px; font-size: 11px; color: var(--head); font-weight: 600; }
    .pal-row { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 6px; margin: 3px 0; }
    .pal-row > span { color: var(--dim); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .sw { display: flex; flex-wrap: wrap; gap: 3px; }
    .sw button { position: relative; width: 26px; height: 20px; padding: 0; border: 1px solid #0008; }
    .sw button.edited::after { content: ''; position: absolute; right: -3px; top: -3px; width: 7px; height: 7px; background: var(--hi); border: 1px solid var(--bg); }
    .sw button.cur { outline: 2px solid var(--head); outline-offset: 1px; }
    #pal-edit { position: sticky; top: 38px; z-index: 1; background: var(--panel2); border: 1px solid var(--line2); padding: 8px; margin: 8px 0; }
    #pal-edit .big { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 6px 0; }
    #pal-edit .big div { height: 26px; border: 1px solid #0008; display: grid; place-items: end start; padding: 2px 4px; font-size: 10px; text-shadow: 0 0 2px #000; line-height: 1; }

    dialog { background: var(--panel2); color: var(--text); border: 1px solid var(--line2); padding: 14px; width: min(720px, 92vw); }
    dialog::backdrop { background: #0d0b16b0; }
    dialog textarea { width: 100%; height: 50vh; background: var(--bg); border: 1px solid var(--line2); padding: 8px; resize: vertical; font-size: 11px; }
    dialog .err { color: var(--warn); min-height: 1.4em; }
    #toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); background: var(--hi); color: var(--bg); padding: 4px 12px; display: none; z-index: 10; }
    @media (max-width: 1500px) {
      main { grid-template-columns: 196px 1fr 292px; }
      .grid { grid-template-columns: 160px; }
    }
  </style>
  <script type="importmap">{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
  } }</script>
  <!-- Library mode for ../asset-viewer/viewer.js: share its renderer, camera and factories; no viewer UI or loop. -->
  <script>window.ASSET_VIEWER_LIBRARY = true;</script>
</head>
<body>
  <header>
    <h1>asset library <span>· commet</span></h1>
    <nav class="tabs" aria-label="Mode">
      <button data-tab="inspect">inspect</button>
      <button data-tab="scene">compose scene</button>
      <button data-tab="palette">palette</button>
      <button data-tab="history" title="How each asset family got to its final look">history</button>
    </nav>
    <div class="actions">
      <button id="copy-url" title="Copy a link that reopens exactly this configuration">copy URL</button>
      <button id="copy-json" title="Copy the configuration as a JSON parameter block">copy JSON</button>
      <button id="import-json" title="Paste a JSON parameter block">import JSON</button>
      <button id="png1" title="Download the stage at its internal resolution">PNG</button>
      <button id="png4" title="Download the stage upscaled ×4 (nearest)">PNG ×4</button>
    </div>
  </header>
  <main>
    <aside id="catalogue" aria-label="Catalogue"></aside>
    <section id="stage" aria-label="Stage">
      <div id="well">
        <figure class="pane" id="pane-main">
          <figcaption></figcaption>
          <div id="frame">
            <canvas id="view"></canvas>
            <img class="arch" alt="archived render" hidden>
            <div id="sel"><span></span></div>
          </div>
          <p class="miss" hidden></p>
        </figure>
        <figure class="pane" id="pane-cmp" hidden>
          <figcaption></figcaption>
          <div class="pic"><canvas id="cmp-view"></canvas><img class="arch" alt="archived render" hidden></div>
          <p class="miss" hidden></p>
        </figure>
      </div>
      <div id="stage-badge"></div>
      <div id="status"></div>
    </section>
    <aside id="panel" aria-label="Controls"></aside>
  </main>
  <dialog id="json-dialog">
    <form method="dialog">
      <p style="margin:0 0 8px">Paste a JSON parameter block (from <b>copy JSON</b>). Unknown or out-of-range values fall back to their defaults.</p>
      <textarea id="json-text" spellcheck="false" aria-label="JSON parameter block"></textarea>
      <div class="err" id="json-err"></div>
      <div class="btns"><button id="json-apply" value="apply">apply</button><button value="cancel">cancel</button></div>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
  <script type="module" src="./library.js"></script>
</body>
</html>
